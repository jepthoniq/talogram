name: Build Talogram IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talogram-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check build environment
        run: |
          xcodebuild -version
          python3 --version
          git submodule status

      - name: Build IPA for iPASide signing
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir "$HOME/telegram-bazel-cache" \
            build \
            --configurationPath build-system/appstore-configuration.json \
            --codesigningInformationPath build-system/fake-codesigning \
            --buildNumber "$GITHUB_RUN_NUMBER" \
            --configuration release_arm64 \
            --outputBuildArtifactsPath build/artifacts

      - name: Verify IPA package
        run: |
          test -s build/artifacts/Telegram.ipa
          unzip -t build/artifacts/Telegram.ipa
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          unzip -q build/artifacts/Telegram.ipa -d "$TEMP_DIR"
          APP_PATH="$(find "$TEMP_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"

      - name: Upload IPA for iPASide
        uses: actions/upload-artifact@v4
        with:
          name: Talogram-IPA-for-iPASide
          path: build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 7
