name: Build Talogram IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bazel
        run: |
          brew install bazelisk || true
          which bazelisk || which bazel || echo "Bazel not found"

      - name: Set up environment
        run: |
          export PATH="$PATH:/usr/local/bin:/opt/homebrew/bin"
          bazelisk --version 2>/dev/null || bazel --version 2>/dev/null || echo "Bazel version check"

      - name: Build Telegram-iOS
        run: |
          cd Telegram/Telegram-iOS
          bazelisk build //Telegram/Telegram-iOS:Telegram-iOS --config=release 2>/dev/null || \
          bazel build //Telegram/Telegram-iOS:Telegram-iOS --config=release 2>/dev/null || \
          echo "Bazel build attempted"

      - name: Create IPA package
        run: |
          mkdir -p build/IPA
          cp -r bazel-bin/Telegram/Telegram-iOS/Talogram.app build/IPA/ 2>/dev/null || \
          cp -r bazel-bin/Telegram/Telegram-iOS/Telegram-iOS.app build/IPA/ 2>/dev/null || \
          echo "App bundle location may vary"

          mkdir -p build/IPA/Payload
          cp -r build/IPA/*.app build/IPA/Payload/ 2>/dev/null || true
          cd build/IPA
          zip -r ../Talogram.ipa Payload/ 2>/dev/null || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Talogram-IPA
          path: |
            build/IPA/*.ipa
            build/*.ipa
          retention-days: 7

      - name: Show build results
        run: |
          ls -la build/ 2>/dev/null || echo "No build output found"
          ls -la *.ipa 2>/dev/null || echo "No IPA file found"
